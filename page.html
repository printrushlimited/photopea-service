<!DOCTYPE html>s
<html>
<head>
  <meta charset="utf-8">
  <title>Photopea Render</title>
  <style>html,body{margin:0;height:100%}#pp{width:100%;height:100vh;border:0}</style>
</head>
<body>
  <!-- Photopea iframe (hidden UI; we drive it via postMessage) -->
  <iframe id="pp" src="https://www.photopea.com"></iframe>

  <script>
  /**
   * Global message buffer: captures every postMessage from Photopea as soon as
   * the page loads, so ready signals fired BEFORE runRender attaches its listener
   * are not lost (fixes the "Timeout waiting for: done" race).
   */
  window.__ppMessages = [];
  window.__ppSeen = new Set();
  window.addEventListener('message', (e) => {
    const key = (typeof e.data === 'string') ? e.data : (e.data instanceof ArrayBuffer ? '__ab__' : JSON.stringify(e.data));
    if (!window.__ppSeen.has(key)) { window.__ppSeen.add(key); window.__ppMessages.push(key); }
  });

  /**
   * Drives Photopea to render a PSD with layer replacements.
   * @param {Object} params
   * @param {string} params.psd_url        - public URL of the PSD file
   * @param {string} params.output_format   - 'jpg' or 'png'
   * @param {Array}  params.replacements   - [{type:'artwork'|'text', layer_name, image_url|text}]
   * @returns {Promise<string>} base64-encoded image (without data: prefix)
   */
  window.runRender = async function (params) {
    const { psd_url, output_format, replacements } = params;
    const pp = document.getElementById('pp').contentWindow;

    // Wait for a specific string marker from Photopea (via app.echoToOE).
    // Checks the buffered history first so an early signal is not missed.
    const waitFor = (target, timeoutMs = 120000) => new Promise((resolve, reject) => {
      if (window.__ppSeen.has(target)) return resolve();
      const to = setTimeout(() => { cleanup(); reject(new Error('Timeout waiting for: ' + target + ' | seen: ' + window.__ppMessages.slice(-12).join(', '))); }, timeoutMs);
      const h = (e) => { if (e.data === target) { cleanup(); resolve(); } };
      const cleanup = () => { clearTimeout(to); window.removeEventListener('message', h); };
      window.addEventListener('message', h);
    });

    // 1. Wait for Photopea to be ready
    await waitFor('done');

    // 2. Load the PSD
    pp.postMessage('app.open(' + JSON.stringify(psd_url) + '); app.echoToOE("psd_loaded");', '*');
    await waitFor('psd_loaded');

    // 3. Run the layer replacements
    pp.postMessage(buildReplacementScript(replacements), '*');
    await waitFor('replaced');

    // 4. Export the document and capture the returned ArrayBuffer
    const arrayBuffer = await new Promise((resolve, reject) => {
      const to = setTimeout(() => { cleanup(); reject(new Error('Export timeout')); }, 120000);
      const h = (e) => { if (e.data instanceof ArrayBuffer) { cleanup(); resolve(e.data); } };
      const cleanup = () => { clearTimeout(to); window.removeEventListener('message', h); };
      window.addEventListener('message', h);
      pp.postMessage('app.activeDocument.saveToOE(' + JSON.stringify(output_format) + ');', '*');
    });

    // 5. Convert to base64 for transport back to Node
    const b64 = await new Promise((resolve) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result).split(',')[1]);
      fr.readAsDataURL(new Blob([arrayBuffer]));
    });
    return b64;
  };

  /**
   * Builds the Photopea script that walks all layers and applies replacements.
   *
   * Text layers: updates the text content with the child's name.
   * Artwork layers (smart objects): removes the named layer, places the new
   * artwork image as a smart object, scales it to fit the original layer's
   * bounds, repositions it, and restores the layer name.
   *
   * NOTE: Photopea's scripting DOM mimics Adobe Photoshop but is not 100%
   * documented. The text-item property and the resize/translate math below are
   * the most likely correct forms; if a specific PSD renders incorrectly you may
   * need to tweak this script. The smart-object replacement re-adds the layer at
   * the top of the stack, so PSDs whose artwork layer is not already near the top
   * may need a manual reorder step added here.
   */
  function buildReplacementScript(replacements) {
    return [
      'var replacements = ' + JSON.stringify(replacements) + ';',
      'var doc = app.activeDocument;',
      'function walk(layers) {',
      '  for (var i = 0; i < layers.length; i++) {',
      '    var l = layers[i];',
      '    if (l.children && l.children.length) { walk(l.children); continue; }',
      '    for (var k = 0; k < replacements.length; k++) {',
      '      var rep = replacements[k];',
      '      if (l.name !== rep.layer_name) continue;',
      '      if (rep.type === "text") { try {',
      '        if (l.textItem) { l.textItem.contents = rep.text; }',
      '        else if (l.text) { l.text.text = rep.text; }',
      '      } catch (e) {} }',
      '      else if (rep.type === "artwork") { try { replaceArtworkLayer(l, rep.image_url); } catch (e) {} }',
      '    }',
      '  }',
      '}',
      'function replaceArtworkLayer(layer, imageUrl) {',
      '  var ob = layer.bounds;',
      '  var ow = ob[2] - ob[0], oh = ob[3] - ob[1];',
      '  var name = layer.name;',
      '  layer.remove();',
      '  app.open(imageUrl, undefined, true);',
      '  var nl = app.activeDocument.activeLayer;',
      '  if (!nl) return;',
      '  var nb = nl.bounds;',
      '  var nw = nb[2] - nb[0], nh = nb[3] - nb[1];',
      '  if (nw > 0 && nh > 0) {',
      '    var scale = Math.min(ow / nw, oh / nh) * 100;',
      '    if (scale > 0) nl.resize(scale, scale);',
      '  }',
      '  var cb = nl.bounds;',
      '  nl.translate(ob[0] - cb[0], ob[1] - cb[1]);',
      '  nl.name = name;',
      '}',
      'walk(doc.layers);',
      'app.echoToOE("replaced");'
    ].join('\n');
  }
  </script>
</body>
</html>
